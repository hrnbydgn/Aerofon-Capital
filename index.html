<!DOCTYPE html>
<html lang="tr" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DJI Agras UI Mockup</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
      integrity="sha384-sA+z4FBx9tWRkjxIl6RAtfkApafWmrhB231gFhP6JAvSh8PNzUGDMYrSLALvE6Eg"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles/custom.css" />
  </head>
  <body class="bg-black text-white">
    <div class="d-flex flex-column min-vh-100">
      <!-- Top Status Bar -->
      <header class="border-bottom border-secondary bg-dark py-2 px-3">
        <div class="container-fluid px-0">
          <div class="d-flex justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center gap-3">
              <span class="badge text-bg-primary text-uppercase">Agras T40</span>
              <div class="small text-secondary">Mode: Auto</div>
              <div class="small text-secondary">RTK: <span class="text-success">Fixed</span></div>
            </div>
            <div class="d-flex align-items-center gap-4 small text-secondary">
              <div><i class="bi bi-battery-full me-1"></i>Drone 87%</div>
              <div><i class="bi bi-battery-half me-1"></i>RC 62%</div>
              <div><i class="bi bi-wifi me-1"></i>Strong</div>
            </div>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <div class="flex-grow-1 position-relative">
        <div class="d-flex h-100">
          <!-- Left Toolbar -->
          <div class="left-toolbar d-none d-lg-flex flex-column align-items-center py-4 gap-3 border-end border-secondary">
            <button class="btn btn-outline-secondary btn-icon" type="button">Fields</button>
            <button class="btn btn-outline-secondary btn-icon" type="button">Layers</button>
            <button class="btn btn-outline-secondary btn-icon" type="button">Zoom</button>
            <button class="btn btn-outline-secondary btn-icon" type="button">Center</button>
          </div>

          <!-- Map Area -->
          <div class="map-area flex-grow-1 position-relative">
            <div id="map" class="h-100 w-100 rounded-4 border border-secondary-subtle bg-dark-subtle"></div>

            <!-- FPV Preview Desktop/Tablet -->
            <div class="fpv-preview d-none d-md-block position-absolute top-0 end-0 m-3 shadow-lg rounded-4 border border-secondary">
              <div class="ratio ratio-16x9 bg-black bg-opacity-75 rounded-4 d-flex align-items-center justify-content-center">
                <span class="text-secondary small">FPV Feed Placeholder</span>
              </div>
            </div>

            <!-- Mobile Control Panel Trigger -->
            <button
              class="btn btn-outline-light position-absolute bottom-0 start-0 m-3 d-md-none"
              id="openMobilePanel"
              type="button"
            >
              Kontrol Paneli
            </button>

            <!-- Mobile FPV Trigger -->
            <button
              class="btn btn-outline-light position-absolute bottom-0 end-0 m-3 d-md-none"
              id="openFpvModal"
              type="button"
            >
              FPV Önizleme
            </button>
          </div>

          <!-- Right Sidebar -->
          <aside class="right-sidebar bg-dark border-start border-secondary d-none d-md-flex flex-column">
            <ul class="nav nav-tabs nav-fill" id="cpTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active"
                  id="cp-list-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#cp-list"
                  type="button"
                  role="tab"
                  aria-controls="cp-list"
                  aria-selected="true"
                >
                  CP List
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="cp-detail-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#cp-detail"
                  type="button"
                  role="tab"
                  aria-controls="cp-detail"
                  aria-selected="false"
                >
                  CP Detail
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="route-settings-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#route-settings"
                  type="button"
                  role="tab"
                  aria-controls="route-settings"
                  aria-selected="false"
                >
                  Route Settings
                </button>
              </li>
            </ul>
            <div class="tab-content flex-grow-1 overflow-auto p-3">
              <div class="tab-pane fade show active" id="cp-list" role="tabpanel" aria-labelledby="cp-list-tab">
                <h6 class="mb-3">Connection Points</h6>
                <div class="list-group list-group-flush" id="cpList">
                  <button class="list-group-item list-group-item-action bg-dark text-white d-flex justify-content-between align-items-center" data-cp-id="CP-01">
                    <span>CP-01</span>
                    <span class="btn btn-sm btn-outline-secondary">View</span>
                  </button>
                  <button class="list-group-item list-group-item-action bg-dark text-white d-flex justify-content-between align-items-center" data-cp-id="CP-02">
                    <span>CP-02</span>
                    <span class="btn btn-sm btn-outline-secondary">View</span>
                  </button>
                  <button class="list-group-item list-group-item-action bg-dark text-white d-flex justify-content-between align-items-center" data-cp-id="CP-03">
                    <span>CP-03</span>
                    <span class="btn btn-sm btn-outline-secondary">View</span>
                  </button>
                </div>
              </div>
              <div class="tab-pane fade" id="cp-detail" role="tabpanel" aria-labelledby="cp-detail-tab">
                <form class="vstack gap-3">
                  <div>
                    <label for="cpName" class="form-label">Name</label>
                    <input type="text" class="form-control" id="cpName" placeholder="CP-01" />
                  </div>
                  <div>
                    <label for="cpActive" class="form-label">Active</label>
                    <select id="cpActive" class="form-select">
                      <option>Enabled</option>
                      <option>Disabled</option>
                    </select>
                  </div>
                  <div>
                    <label for="cpDirection" class="form-label">Preferred Direction</label>
                    <input type="text" class="form-control" id="cpDirection" placeholder="North" />
                  </div>
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" value="" id="cpObstacle" />
                    <label class="form-check-label" for="cpObstacle">Use for obstacle avoidance</label>
                  </div>
                  <div class="text-end">
                    <button type="button" class="btn btn-primary" id="saveCpBtn">Save</button>
                  </div>
                </form>
              </div>
              <div class="tab-pane fade" id="route-settings" role="tabpanel" aria-labelledby="route-settings-tab">
                <form class="vstack gap-3">
                  <div>
                    <label for="scanDirection" class="form-label">Scan Direction</label>
                    <select id="scanDirection" class="form-select">
                      <option>N–S</option>
                      <option>E–W</option>
                    </select>
                  </div>
                  <div>
                    <label for="lineSpacing" class="form-label">Line Spacing (m)</label>
                    <input type="number" class="form-control" id="lineSpacing" value="5" min="1" />
                  </div>
                  <div>
                    <label for="turnBehavior" class="form-label">Turning Behavior</label>
                    <select id="turnBehavior" class="form-select">
                      <option>Smooth</option>
                      <option>Sharp</option>
                    </select>
                  </div>
                  <div class="text-end">
                    <button type="button" class="btn btn-outline-light">Apply</button>
                  </div>
                </form>
              </div>
            </div>
          </aside>
        </div>
      </div>

      <!-- Bottom Task Bar -->
      <footer class="border-top border-secondary bg-dark py-3">
        <div class="container-fluid px-3">
          <div class="row g-3 align-items-center">
            <div class="col-12 col-lg-3 d-flex gap-2">
              <button class="btn btn-success w-100" type="button">Takeoff</button>
              <button class="btn btn-danger w-100" type="button">Land</button>
            </div>
            <div class="col-12 col-lg-5">
              <div class="bg-black bg-opacity-50 rounded-3 p-3 small d-flex justify-content-between">
                <span>Remaining Area: 12.4 ha</span>
                <span>ETA: 18 min</span>
              </div>
            </div>
            <div class="col-12 col-lg-4">
              <label for="speedSlider" class="form-label small mb-1">Speed</label>
              <input type="range" class="form-range" min="0" max="10" id="speedSlider" />
            </div>
          </div>
        </div>
      </footer>
    </div>

    <!-- Mobile FPV Modal -->
    <div class="modal fade" id="fpvModal" tabindex="-1" aria-labelledby="fpvModalLabel" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-white">
          <div class="modal-header border-secondary">
            <h5 class="modal-title" id="fpvModalLabel">FPV Preview</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <div class="ratio ratio-16x9 bg-black bg-opacity-75 rounded-3 d-flex align-items-center justify-content-center">
              <span class="text-secondary">FPV Feed Placeholder</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Mobile Right Panel Offcanvas -->
    <div class="offcanvas offcanvas-bottom text-bg-dark" tabindex="-1" id="mobileCpPanel" aria-labelledby="mobileCpPanelLabel">
      <div class="offcanvas-header border-secondary">
        <h5 class="offcanvas-title" id="mobileCpPanelLabel">Control Panel</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="nav nav-tabs nav-fill" id="mobileCpTabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="mobile-cp-list-tab" data-bs-toggle="tab" data-bs-target="#mobile-cp-list" type="button" role="tab" aria-controls="mobile-cp-list" aria-selected="true">CP List</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="mobile-cp-detail-tab" data-bs-toggle="tab" data-bs-target="#mobile-cp-detail" type="button" role="tab" aria-controls="mobile-cp-detail" aria-selected="false">CP Detail</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="mobile-route-settings-tab" data-bs-toggle="tab" data-bs-target="#mobile-route-settings" type="button" role="tab" aria-controls="mobile-route-settings" aria-selected="false">Route Settings</button>
          </li>
        </ul>
        <div class="tab-content pt-3">
          <div class="tab-pane fade show active" id="mobile-cp-list" role="tabpanel" aria-labelledby="mobile-cp-list-tab">
            <div class="list-group list-group-flush" id="mobileCpList">
              <button class="list-group-item list-group-item-action bg-dark text-white d-flex justify-content-between align-items-center" data-cp-id="CP-01">
                <span>CP-01</span>
                <span class="btn btn-sm btn-outline-secondary">View</span>
              </button>
              <button class="list-group-item list-group-item-action bg-dark text-white d-flex justify-content-between align-items-center" data-cp-id="CP-02">
                <span>CP-02</span>
                <span class="btn btn-sm btn-outline-secondary">View</span>
              </button>
              <button class="list-group-item list-group-item-action bg-dark text-white d-flex justify-content-between align-items-center" data-cp-id="CP-03">
                <span>CP-03</span>
                <span class="btn btn-sm btn-outline-secondary">View</span>
              </button>
            </div>
          </div>
          <div class="tab-pane fade" id="mobile-cp-detail" role="tabpanel" aria-labelledby="mobile-cp-detail-tab">
            <form class="vstack gap-3">
              <div>
                <label for="mobileCpName" class="form-label">Name</label>
                <input type="text" class="form-control" id="mobileCpName" placeholder="CP-01" />
              </div>
              <div>
                <label for="mobileCpActive" class="form-label">Active</label>
                <select id="mobileCpActive" class="form-select">
                  <option>Enabled</option>
                  <option>Disabled</option>
                </select>
              </div>
              <div>
                <label for="mobileCpDirection" class="form-label">Preferred Direction</label>
                <input type="text" class="form-control" id="mobileCpDirection" placeholder="North" />
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="mobileCpObstacle" />
                <label class="form-check-label" for="mobileCpObstacle">Use for obstacle avoidance</label>
              </div>
              <div class="text-end">
                <button type="button" class="btn btn-primary">Save</button>
              </div>
            </form>
          </div>
          <div class="tab-pane fade" id="mobile-route-settings" role="tabpanel" aria-labelledby="mobile-route-settings-tab">
            <form class="vstack gap-3">
              <div>
                <label for="mobileScanDirection" class="form-label">Scan Direction</label>
                <select id="mobileScanDirection" class="form-select">
                  <option>N–S</option>
                  <option>E–W</option>
                </select>
              </div>
              <div>
                <label for="mobileLineSpacing" class="form-label">Line Spacing (m)</label>
                <input type="number" class="form-control" id="mobileLineSpacing" value="5" min="1" />
              </div>
              <div>
                <label for="mobileTurnBehavior" class="form-label">Turning Behavior</label>
                <select id="mobileTurnBehavior" class="form-select">
                  <option>Smooth</option>
                  <option>Sharp</option>
                </select>
              </div>
              <div class="text-end">
                <button type="button" class="btn btn-outline-light">Apply</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
      defer
    ></script>
    <script src="scripts/app.js" defer></script>
  </body>
</html>
