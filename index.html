<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">
    <title>QGroundControl</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Orientation Warning -->
    <div id="orientation-warning">
        <i class="fas fa-mobile-screen fa-rotate-90 fa-5x"></i>
        <h2>Lütfen Cihazınızı Yatay Konuma Çevirin</h2>
        <p>Bu uygulama sadece yatay (landscape) modda çalışır</p>
    </div>

    <div id="app">
        <!-- Map Container (Full or PIP) -->
        <div id="map-container" class="view-panel mode-fullscreen">
            <div id="map"></div>
        </div>

        <!-- Camera Container (Full or PIP) -->
        <div id="camera-container" class="view-panel mode-pip" onclick="swapViews()">
            <div class="live-badge">
                <i class="fas fa-circle"></i> CANLI
            </div>
            <div class="camera-overlay">
                <div class="camera-crosshair">
                    <div class="crosshair-h"></div>
                    <div class="crosshair-v"></div>
                </div>
                <div class="camera-info">
                    <span>1920x1080 | 30fps</span>
                </div>
            </div>
        </div>

        <!-- Top Bar -->
        <header class="top-bar ui-layer">
            <div class="top-left">
                <div class="qgc-logo">
                    <i class="fas fa-paper-plane"></i>
                </div>
                <div class="vehicle-status">
                    <div class="status-indicator" id="connectionStatus"></div>
                    <span class="status-text" id="statusText">Hazır</span>
                </div>
                <div class="flight-mode" id="flightMode">STABILIZE</div>
            </div>
            <div class="top-right">
                <div class="top-info-item">
                    <i class="fas fa-satellite-dish"></i>
                    <span id="signalStrength">100%</span>
                </div>
                <div class="top-info-item">
                    <i class="fas fa-battery-full" id="batteryIcon"></i>
                    <span id="batteryVoltage">16.8V</span>
                </div>
                <div class="top-info-item">
                    <i class="fas fa-clock"></i>
                    <span id="flightTime">00:00</span>
                </div>
                <button class="arm-btn" id="armBtn">
                    <i class="fas fa-power-off"></i>
                    <span>ARM</span>
                </button>
            </div>
        </header>

        <!-- Left Toolbar -->
        <div class="left-toolbar ui-layer">
            <div class="toolbar-section">
                <button class="tool-btn active" data-tool="fly">
                    <i class="fas fa-plane"></i>
                    <span>FLY</span>
                </button>
                <button class="tool-btn" data-tool="plan">
                    <i class="fas fa-route"></i>
                    <span>PLAN</span>
                </button>
                <button class="tool-btn" onclick="toggleTakeoffSlider()">
                    <i class="fas fa-plane-departure"></i>
                    <span>TAKEOFF</span>
                </button>
            </div>
        </div>

        <!-- Right Instruments Panel -->
        <div class="right-instruments ui-layer">
            <!-- Attitude Indicator -->
            <div class="instrument-widget attitude-widget">
                <canvas id="attitudeCanvas" width="180" height="180"></canvas>
                <div class="instrument-label">ATTITUDE</div>
            </div>

            <!-- Compass -->
            <div class="instrument-widget compass-widget">
                <canvas id="compassCanvas" width="140" height="140"></canvas>
                <div class="heading-display" id="headingDisplay">0°</div>
                <div class="instrument-label">HEADING</div>
            </div>
        </div>

        <!-- Bottom Telemetry Panel -->
        <div class="bottom-telemetry ui-layer">
            <div class="telemetry-grid">
                <div class="telem-item">
                    <div class="telem-icon"><i class="fas fa-arrow-up"></i></div>
                    <div class="telem-data">
                        <div class="telem-label">ALTITUDE</div>
                        <div class="telem-value" id="altitude">0.0 m</div>
                    </div>
                </div>
                <div class="telem-item">
                    <div class="telem-icon"><i class="fas fa-gauge-high"></i></div>
                    <div class="telem-data">
                        <div class="telem-label">SPEED</div>
                        <div class="telem-value" id="groundspeed">0.0 m/s</div>
                    </div>
                </div>
                <div class="telem-item">
                    <div class="telem-icon"><i class="fas fa-arrow-trend-up"></i></div>
                    <div class="telem-data">
                        <div class="telem-label">CLIMB</div>
                        <div class="telem-value" id="climbrate">0.0 m/s</div>
                    </div>
                </div>
                <div class="telem-item">
                    <div class="telem-icon"><i class="fas fa-location-dot"></i></div>
                    <div class="telem-data">
                        <div class="telem-label">DISTANCE</div>
                        <div class="telem-value" id="homeDistance">0 m</div>
                    </div>
                </div>
                <div class="telem-item">
                    <div class="telem-icon"><i class="fas fa-satellite"></i></div>
                    <div class="telem-data">
                        <div class="telem-label">GPS</div>
                        <div class="telem-value" id="gpsStatus">
                            <span id="gpsSats">0</span> sats
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Takeoff Slider -->
        <div class="takeoff-slider ui-layer" id="takeoffSlider">
            <div class="slider-track">
                <span class="slider-text">KALKIŞ İÇİN KAYDIRIN</span>
                <div class="slider-thumb" id="sliderThumb">
                    <i class="fas fa-chevron-right"></i>
                    <i class="fas fa-chevron-right"></i>
                    <i class="fas fa-chevron-right"></i>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="app.js"></script>
</body>
</html>
